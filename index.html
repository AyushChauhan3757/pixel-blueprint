<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pixel Art Blueprint</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#6f4bff">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Pixelify+Sans:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f4fb;--panel:#fff;--tx:#1c1833;--mu:#6b6785;--bd:#ddd8ee;--ac:#6f4bff;--act:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#110e24;--panel:#1b1736;--tx:#efeafd;--mu:#9f99c2;--bd:#352f5e;--ac:#8d73ff}}
:root[data-theme="dark"]{--bg:#110e24;--panel:#1b1736;--tx:#efeafd;--mu:#9f99c2;--bd:#352f5e;--ac:#8d73ff}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 'DM Sans',system-ui,sans-serif}
main{max-width:900px;margin:0 auto;padding:16px}
h1{font:700 26px 'Pixelify Sans',monospace;margin:0 0 4px}
.sub{color:var(--mu);margin:0 0 14px}
.box{background:var(--panel);border:1px solid var(--bd);border-radius:10px;padding:12px;margin-bottom:12px}
button,select,input[type=number]{font:inherit;color:var(--tx);background:var(--panel);border:1px solid var(--bd);border-radius:8px;padding:8px 10px;min-height:40px}
button{cursor:pointer}
button.on{background:var(--ac);color:var(--act);border-color:var(--ac)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid2 label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--mu)}
.grid2 input{width:100%}
#file{display:none}
.tog{display:flex;gap:6px 16px;flex-wrap:wrap;font-size:14px}
.tog label{display:flex;align-items:center;gap:6px;min-height:32px}
#wrap{overflow:auto;max-height:72vh;border:1px solid var(--bd);border-radius:8px;background:var(--panel)}
canvas{display:block}
#pal{display:flex;flex-wrap:wrap;gap:6px}
.chip{width:76px;border-radius:8px;padding:6px 4px;text-align:center;font-size:12px;line-height:1.25;border:2px solid transparent;cursor:pointer;min-height:44px}
.chip b{display:block;font-size:15px}
.chip.sel{border-color:var(--ac);outline:2px solid var(--tx)}
#info,#hint{font-size:13px;color:var(--mu)}
#drop{border:2px dashed var(--bd);border-radius:10px;padding:26px 14px;text-align:center;color:var(--mu)}
.hide{display:none!important}
textarea{width:100%;min-height:260px;font:14px/1.5 'DM Sans',system-ui,sans-serif;color:var(--tx);background:var(--panel);border:1px solid var(--bd);border-radius:8px;padding:10px;resize:vertical}
#ase ol{margin:6px 0 10px;padding-left:20px}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
</style>
</head>
<body>
<main>
<h1>Pixel Art Blueprint</h1>
<p class="sub">Upload pixel art and get a grid you can redraw from, one tile at a time.</p>
<div class="row" style="margin-bottom:12px"><button id="t1" class="on">Blueprint</button><button id="t2">Prompts</button></div>
<div id="pg1">
<div class="box">
<div class="row"><button id="up" class="on">Upload image</button><input id="file" type="file" accept="image/*"><span id="info">No image yet</span></div>
<div class="grid2" style="margin-top:10px">
<label>Grid width (px)<input id="gw" type="number" min="8" max="512" value="96"></label>
<label>Max colors<input id="mc" type="number" min="2" max="64" value="32"></label>
<label>Tile width<input id="tw" type="number" min="4" max="64" value="32"></label>
<label>Tile height<input id="th" type="number" min="4" max="64" value="32"></label>
</div>
<p id="hint" style="margin:8px 0 0"></p>
<div id="qw" class="row" style="margin-top:8px"></div>
</div>
<div id="drop">Drop an image here or tap Upload image. It stays on your device.</div>
<div id="app" class="hide">
<div class="row" style="margin-bottom:10px">
<button id="vf" class="on">Full scene</button><button id="vt">Tile view</button>
</div>
<div id="tilebar" class="row hide" style="margin-bottom:10px">
<button id="pv" aria-label="Previous tile">&lt;</button><select id="sel" style="flex:1;min-width:0"></select><button id="nx" aria-label="Next tile">&gt;</button>
</div>
<div class="tog" style="margin-bottom:10px">
<label><input type="checkbox" id="g" checked> Grid</label>
<label><input type="checkbox" id="n" checked> Coordinates</label>
<label><input type="checkbox" id="d"> Color numbers</label>
<label id="tbl"><input type="checkbox" id="tb" checked> Tile borders</label>
</div>
<div id="zrow" class="row" style="margin-bottom:10px"><label for="z" style="font-size:13px;color:var(--mu)">Zoom</label><input id="z" type="range" min="2" max="20" value="6" style="flex:1"></div>
<div id="wrap"><canvas id="cv"></canvas></div>
<p id="cap" style="font-size:13px;color:var(--mu);margin:8px 0 12px"></p>
<div class="box"><div id="ph" style="font-weight:700;margin-bottom:8px"></div><div id="pal"></div></div>
<div class="box" id="ase"></div>
</div>
</div>
<div id="pg2" class="hide">
<div class="box"><div style="font-weight:700;margin-bottom:6px">AI pixel-art cleanup prompt</div>
<p class="sub" style="margin:0 0 8px">Edit it and it is saved on this device. Paste your own prompt over the starter text.</p>
<textarea id="pr" aria-label="Cleanup prompt"></textarea>
<div class="row" style="margin-top:8px"><button id="pc" class="on">Copy prompt</button><button id="prs">Reset to starter</button><span id="pm" style="font-size:13px;color:var(--mu)"></span></div></div>
</div>
</main>
<script>
const $=i=>document.getElementById(i),M=26,D=Math.min(2,window.devicePixelRatio||1);
let G=null,P=[],gw=0,gh=0,tw=32,th=32,mode='f',cur=0,hl=-1,src=null,auto=null;
const cv=$('cv'),cx=cv.getContext('2d');
const hex=c=>'#'+c.map(v=>v.toString(16).padStart(2,'0')).join('');
const lum=c=>(0.299*c[0]+0.587*c[1]+0.114*c[2])/255;
const tname=(i,cols)=>{const c=i%cols,r=Math.floor(i/cols);return String.fromCharCode(65+(c%26))+(r+1)};
function gridScore(e,L,p,o){let T=0;for(let i=1;i<L;i++)T+=e[i];if(!T)return 0;
const w=p>=6?1:0;let on=0,n=0;
for(let k=0;;k++){const b=Math.round(o+k*p);if(b>=L)break;if(b<1)continue;n++;for(let d=-w;d<=w;d++){const q=b+d;if(q>=1&&q<L)on+=e[q]}}
const ch=Math.min(.95,n*(2*w+1)/(L-1));return(on/T-ch)/(1-ch)}
function detectGrid(im,W,H){
const d=im.data,ex=new Float64Array(W),ey=new Float64Array(H),sy=Math.max(1,H/240|0),sx=Math.max(1,W/240|0),t=16;
for(let y=0;y<H;y+=sy)for(let x=1;x<W;x++){const i=(y*W+x)*4,j=i-4,v=Math.abs(d[i]-d[j])+Math.abs(d[i+1]-d[j+1])+Math.abs(d[i+2]-d[j+2])-t;if(v>0)ex[x]+=v}
for(let x=0;x<W;x+=sx)for(let y=1;y<H;y++){const i=(y*W+x)*4,j=i-W*4,v=Math.abs(d[i]-d[j])+Math.abs(d[i+1]-d[j+1])+Math.abs(d[i+2]-d[j+2])-t;if(v>0)ey[y]+=v}
const cand=[],tryP=(p,ph)=>{let a=-9,ox=0,b=-9,oy=0;for(const o of ph){const s=gridScore(ex,W,p,o);if(s>a){a=s;ox=o}const u=gridScore(ey,H,p,o);if(u>b){b=u;oy=o}}cand.push({p,ox,oy,s:(a+b)/2})};
for(let p=2;p<=64&&p<=W/16;p++){if(W/p>512)continue;tryP(p,[...Array(p).keys()])}
for(let n=16;n<=Math.min(512,W/2);n++){const p=W/n;if(Number.isInteger(p))continue;tryP(p,[0])}
if(!cand.length)return null;const mx=Math.max(...cand.map(c=>c.s));if(mx<0.5)return null;
const top=cand.filter(c=>c.s>=mx*0.93).sort((a,b)=>b.p-a.p)[0];
return{p:top.p,ox:top.ox,oy:top.oy,s:top.s,gw:Math.floor((W-top.ox)/top.p+1e-6),gh:Math.floor((H-top.oy)/top.p+1e-6)}}
function uniq(im){const s=new Set(),d=im.data;for(let i=0;i<d.length;i+=4){s.add(d[i]<<16|d[i+1]<<8|d[i+2]);if(s.size>512)return s.size}return s.size}
function autoGrid(){const W=src.w,H=src.h,g=detectGrid(src.im,W,H);
if(g)return{p:g.p,ox:g.ox,oy:g.oy,gw:g.gw,clean:true,why:'grid'};
if(W<=512&&uniq(src.im)<=512)return{p:1,ox:0,oy:0,gw:W,clean:true,why:'native'};
const p=Math.max(1,Math.ceil(W/256));return{p,ox:0,oy:0,gw:Math.floor(W/p),clean:false,why:'estimate'}}
function note(){const W=src.w,au=auto&&auto.gw==gw,f=v=>+v.toFixed(2);let t;
if(au&&auto.why=='grid')t='Pixel grid found automatically: each art pixel is '+f(auto.p)+' source px, so the art is '+gw+'×'+gh+'.';
else if(au&&auto.why=='native')t='Already at native pixel size, so the grid matches the image.';
else if(au)t='No clean pixel grid found (the blocks are uneven). Using '+gw+' wide, where each cell covers '+auto.p+' source px. Cleaning the image first gives a sharper result.';
else t='Manual width: each cell covers '+f(W/gw)+' source px.'+(W%gw?' That is not a whole number, so cells blend. Try one of the widths below.':'');
$('hint').textContent=t;
const ds=[];for(let n=16;n<=512;n++)if(W%n==0)ds.push(n);
ds.sort((a,b)=>Math.abs(Math.log(a/gw))-Math.abs(Math.log(b/gw)));
$('qw').innerHTML=(ds.length?'<span style="font-size:13px;color:var(--mu)">Exact widths:</span>':'')+ds.slice(0,6).sort((a,b)=>a-b).map(n=>'<button data-w="'+n+'"'+(n==gw?' class="on"':'')+'>'+n+'</button>').join('')+'<button id="ad">Auto-detect again</button>'}
function mcut(es,k){let bx=[es];while(bx.length<k){let bi=-1,bs=0,ch=0;bx.forEach((b,i)=>{if(b.length<2)return;for(let c=0;c<3;c++){let lo=255,hi=0;b.forEach(e=>{lo=Math.min(lo,e[c]);hi=Math.max(hi,e[c])});if(hi-lo>bs){bs=hi-lo;bi=i;ch=c}}});if(bi<0)break;const b=bx[bi].sort((a,c)=>a[ch]-c[ch]);const tot=b.reduce((s,e)=>s+e[3],0);let acc=0,m=0;for(;m<b.length-2;m++){acc+=b[m][3];if(acc>=tot/2)break}bx.splice(bi,1,b.slice(0,m+1),b.slice(m+1))}
return bx.map(b=>{let t=0,r=0,g=0,l=0;b.forEach(e=>{t+=e[3];r+=e[0]*e[3];g+=e[1]*e[3];l+=e[2]*e[3]});return[Math.round(r/t),Math.round(g/t),Math.round(l/t)]})}
function build(){
if(!src)return;
const W=src.w,H=src.h,d=src.im.data;
gw=Math.max(8,Math.min(512,+$('gw').value||W));
const au=auto&&auto.gw==gw,sc=au?auto.p:W/gw,ox=au?auto.ox:0,oy=au?auto.oy:0,inset=au&&auto.clean&&sc>=4?Math.floor(sc/4):0;
gh=Math.max(1,au?Math.floor((H-oy)/sc+1e-6):Math.round(H/sc));
const raw=[],cnt=new Map();
for(let y=0;y<gh;y++)for(let x=0;x<gw;x++){
const x0=ox+Math.floor(x*sc)+inset,x1=Math.max(x0+1,ox+Math.floor((x+1)*sc)-inset),y0=oy+Math.floor(y*sc)+inset,y1=Math.max(y0+1,oy+Math.floor((y+1)*sc)-inset);
let r=0,g=0,b=0,a=0,n=0;
for(let j=y0;j<y1&&j<H;j++)for(let i=x0;i<x1&&i<W;i++){const k=(j*W+i)*4,al=d[k+3];r+=d[k]*al;g+=d[k+1]*al;b+=d[k+2]*al;a+=al;n++}
if(!n||a/n<128){raw.push(-1);continue}
const c=[Math.round(r/a),Math.round(g/a),Math.round(b/a)],key=(c[0]<<16)|(c[1]<<8)|c[2];
raw.push(key);cnt.set(key,(cnt.get(key)||0)+1)}
const mx=Math.max(2,Math.min(64,+$('mc').value||32));
const es=[...cnt].map(([k,v])=>[k>>16,(k>>8)&255,k&255,v]);
let pal=es.length<=mx?es.map(e=>[e[0],e[1],e[2]]):mcut(es,mx);
pal=pal.sort((a,b)=>lum(a)-lum(b));
const map=new Map();
const near=key=>{if(map.has(key))return map.get(key);const r=key>>16,g=(key>>8)&255,b=key&255;let bi=0,bd=1e9;pal.forEach((p,i)=>{const dd=(p[0]-r)**2+(p[1]-g)**2+(p[2]-b)**2;if(dd<bd){bd=dd;bi=i}});map.set(key,bi);return bi};
G=raw.map(k=>k<0?-1:near(k));P=pal;
tw=Math.max(4,Math.min(64,+$('tw').value||32));th=Math.max(4,Math.min(64,+$('th').value||32));
const tc=Math.ceil(gw/tw),tr=Math.ceil(gh/th);
$('sel').innerHTML=Array.from({length:tc*tr},(_,i)=>{const c=i%tc,r=Math.floor(i/tc),x=c*tw,y=r*th;return'<option value="'+i+'">Tile '+tname(i,tc)+' (x '+x+'–'+(Math.min(gw,x+tw)-1)+', y '+y+'–'+(Math.min(gh,y+th)-1)+')</option>'}).join('');
cur=Math.min(cur,tc*tr-1);$('sel').value=cur;
$('info').textContent='Source '+W+'×'+H+', grid '+gw+'×'+gh+', '+P.length+' colors, '+tc*tr+' tiles';
hl=-1;note();render()}
function view(){const tc=Math.ceil(gw/tw);
if(mode=='f'){const cs=+$('z').value;return{x:0,y:0,w:gw,h:gh,cs}}
const c=cur%tc,r=Math.floor(cur/tc),x=c*tw,y=r*th,w=Math.min(tw,gw-x),h=Math.min(th,gh-y);
const av=Math.min(window.innerWidth-56,860),cs=Math.max(9,Math.min(26,Math.floor((av-M)/w)));return{x,y,w,h,cs}}
function render(){
if(!G)return;
const v=view(),cs=v.cs,tc=Math.ceil(gw/tw),tr=Math.ceil(gh/th);
cv.width=(M+v.w*cs)*D;cv.height=(M+v.h*cs)*D;cv.style.width=(M+v.w*cs)+'px';cv.style.height=(M+v.h*cs)+'px';
cx.setTransform(D,0,0,D,0,0);
const css=getComputedStyle(document.body),tcol=css.color,used={};
for(let j=0;j<v.h;j++)for(let i=0;i<v.w;i++){const c=G[(v.y+j)*gw+v.x+i],X=M+i*cs,Y=M+j*cs;
if(c<0){cx.fillStyle=(i+j)%2?'#bbb':'#e6e6e6';cx.fillRect(X,Y,cs,cs);continue}
used[c]=(used[c]||0)+1;cx.fillStyle=hex(P[c]);cx.fillRect(X,Y,cs,cs);
if(hl>=0&&c!=hl){cx.fillStyle='rgba(0,0,0,0.65)';cx.fillRect(X,Y,cs,cs)}}
if($('g').checked&&cs>=6){
for(let i=0;i<=v.w;i++){const m=(v.x+i)%8==0;cx.strokeStyle=m?'rgba(255,255,255,0.6)':'rgba(0,0,0,0.3)';cx.lineWidth=m?0.9:0.5;cx.beginPath();cx.moveTo(M+i*cs,M);cx.lineTo(M+i*cs,M+v.h*cs);cx.stroke()}
for(let j=0;j<=v.h;j++){const m=(v.y+j)%8==0;cx.strokeStyle=m?'rgba(255,255,255,0.6)':'rgba(0,0,0,0.3)';cx.lineWidth=m?0.9:0.5;cx.beginPath();cx.moveTo(M,M+j*cs);cx.lineTo(M+v.w*cs,M+j*cs);cx.stroke()}}
if(mode=='f'&&$('tb').checked){cx.strokeStyle='#fff';cx.lineWidth=1.5;
for(let c=0;c<=tc;c++){const x=Math.min(gw,c*tw);cx.beginPath();cx.moveTo(M+x*cs,M);cx.lineTo(M+x*cs,M+gh*cs);cx.stroke()}
for(let r=0;r<=tr;r++){const y=Math.min(gh,r*th);cx.beginPath();cx.moveTo(M,M+y*cs);cx.lineTo(M+gw*cs,M+y*cs);cx.stroke()}
cx.font='bold 11px DM Sans,sans-serif';cx.textAlign='left';cx.textBaseline='top';
for(let t=0;t<tc*tr;t++){const x=(t%tc)*tw,y=Math.floor(t/tc)*th,s=tname(t,tc),px=M+x*cs+3,py=M+y*cs+3;cx.lineWidth=3;cx.strokeStyle='rgba(0,0,0,0.8)';cx.strokeText(s,px,py);cx.fillStyle='#fff';cx.fillText(s,px,py)}}
if($('d').checked&&cs>=11){cx.font='bold '+Math.min(11,Math.floor(cs*0.55))+'px DM Sans,sans-serif';cx.textAlign='center';cx.textBaseline='middle';
for(let j=0;j<v.h;j++)for(let i=0;i<v.w;i++){const c=G[(v.y+j)*gw+v.x+i];if(c<0)continue;cx.fillStyle=lum(P[c])>0.5?'#000':'#fff';cx.fillText(c,M+i*cs+cs/2,M+j*cs+cs/2+0.5)}}
if($('n').checked){cx.fillStyle=tcol;const all=mode=='t'||cs>=20,fs=all?Math.max(7,Math.min(11,Math.floor(cs*0.62))):10;cx.font=fs+'px DM Sans,sans-serif';cx.textBaseline='middle';
const ns=[1,2,4,5,8,10,16,20,32,50,100],st=all?1:(ns.find(s=>s*cs>=(gw>=100?34:26))||100),sh=(n,k)=>all||n%st==0||(k&&st>2&&(n%st)*cs>=34);const rot=all&&cx.measureText(''+Math.max(v.x+v.w-1,v.y+v.h-1)).width>cs-4;
for(let i=0;i<v.w;i++){const gx=v.x+i,X=M+i*cs+cs/2;if(!sh(gx,i==v.w-1))continue;if(rot){cx.save();cx.translate(X,M-3);cx.rotate(-Math.PI/2);cx.textAlign='left';cx.fillText(gx,0,0);cx.restore()}else{cx.textAlign='center';cx.fillText(gx,X,M/2)}}
cx.textAlign='right';for(let j=0;j<v.h;j++){const gy=v.y+j;if(sh(gy,j==v.h-1))cx.fillText(gy,M-3,M+j*cs+cs/2)}}
const keys=(mode=='f'?P.map((_,i)=>i):Object.keys(used).map(Number)).sort((a,b)=>a-b);
$('ph').textContent=mode=='f'?'Full palette ('+keys.length+' colors)':'Palette for tile '+tname(cur,tc)+' ('+keys.length+' colors)';
$('pal').innerHTML=keys.map(i=>{const c=P[i];return'<div class="chip'+(hl==i?' sel':'')+'" data-i="'+i+'" role="button" tabindex="0" style="background:'+hex(c)+';color:'+(lum(c)>0.5?'#000':'#fff')+'"><b>'+i+'</b>'+hex(c)+'</div>'}).join('');
$('cap').textContent=mode=='f'?'Tap a tile in the full scene to open it. Tap a palette color to highlight it.':'Columns '+v.x+'–'+(v.x+v.w-1)+', rows '+v.y+'–'+(v.y+v.h-1)+'. Tap a palette color to highlight it.';
$('tilebar').classList.toggle('hide',mode=='f');$('zrow').classList.toggle('hide',mode!='f');$('tbl').classList.toggle('hide',mode!='f');
$('vf').classList.toggle('on',mode=='f');$('vt').classList.toggle('on',mode=='t');$('sel').value=cur}
function load(f){if(!f)return;const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=im.naturalWidth;c.height=im.naturalHeight;const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(im,0,0);
src={w:c.width,h:c.height,im:x.getImageData(0,0,c.width,c.height)};
auto=autoGrid();$('gw').value=auto.gw;
$('drop').classList.add('hide');$('app').classList.remove('hide');cur=0;mode='f';
$('z').value=Math.max(2,Math.min(20,Math.floor((Math.min(window.innerWidth-56,860)-M)/Math.min(512,+$('gw').value))));
build();URL.revokeObjectURL(im.src)};im.src=URL.createObjectURL(f)}
$('qw').onclick=e=>{const b=e.target.closest('button');if(!b||!src)return;if(b.id=='ad'){auto=autoGrid();$('gw').value=auto.gw}else $('gw').value=b.dataset.w;build()};
$('up').onclick=()=>$('file').click();$('file').onchange=e=>load(e.target.files[0]);
document.body.addEventListener('dragover',e=>e.preventDefault());document.body.addEventListener('drop',e=>{e.preventDefault();load(e.dataTransfer.files[0])});
['gw','mc','tw','th'].forEach(i=>$(i).onchange=()=>{build()});
['g','n','d','tb','z'].forEach(i=>$(i).oninput=render);
$('vf').onclick=()=>{mode='f';render()};$('vt').onclick=()=>{mode='t';render()};
$('sel').onchange=()=>{cur=+$('sel').value;render()};
const nt=()=>Math.ceil(gw/tw)*Math.ceil(gh/th);
$('nx').onclick=()=>{cur=(cur+1)%nt();render()};$('pv').onclick=()=>{cur=(cur+nt()-1)%nt();render()};
$('pal').onclick=e=>{const c=e.target.closest('.chip');if(!c)return;const i=+c.dataset.i;hl=hl==i?-1:i;render()};

const _b=build;build=function(){_b();ase()};
const STARTER='Redraw this image as true pixel art on one strict, fixed pixel grid. Every pixel must be exactly the same size and perfectly square, with no half-size or uneven blocks. No anti-aliasing, no blur, no gradients between pixels, no dithering noise. Use at most 32 flat colors. Keep the composition, shapes and overall colors of the original.';
const pr=$('pr');let sv=null;try{sv=localStorage.getItem('pab-prompt')}catch(e){}
pr.value=sv||STARTER;
pr.oninput=()=>{try{localStorage.setItem('pab-prompt',pr.value)}catch(e){}};
$('pc').onclick=()=>{navigator.clipboard.writeText(pr.value).then(()=>$('pm').textContent='Copied',()=>$('pm').textContent='Copy failed')};
